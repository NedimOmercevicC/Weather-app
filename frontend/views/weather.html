<!-- Weather -->
<section class="projects-section bg-light" id="weather">
    <div class="container px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5 justify-content-center mb-4">
            <div class="col-lg-10">
                <h2 class="mb-3">Check the Weather</h2>
                <form id="weatherForm" class="row g-2">
                    <div class="col-sm-6 col-md-4">
                        <input class="form-control" id="cityInput" type="text" placeholder="Enter city (e.g., Sarajevo)" aria-label="City" required>
                    </div>
                    <div class="col-sm-6 col-md-3">
                        <select class="form-select" id="unitsSelect" aria-label="Units">
                            <option value="metric" selected>Metric (°C)</option>
                            <option value="imperial">Imperial (°F)</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" id="weatherSubmit" type="submit">Get Weather</button>
                    </div>
                </form>
                <div class="mt-3">
                    <div class="small text-muted mb-2">Free quick cities:</div>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm quick-city" data-city="Sarajevo">Sarajevo</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm quick-city" data-city="Fojnica">Fojnica</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm quick-city" data-city="Rakovica">Rakovica</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm quick-city" data-city="Tuzla">Tuzla</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm quick-city" data-city="Mostar">Mostar</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-lg-10">
                <div id="weatherResult" class="card shadow-sm d-none">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <h4 id="weatherCity" class="mb-1"></h4>
                                <div class="text-muted" id="weatherDesc"></div>
                            </div>
                            <div class="text-end">
                                <div class="display-6" id="weatherTemp"></div>
                                <div class="small text-muted" id="weatherMeta"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="weatherError" class="alert alert-danger d-none mt-3" role="alert"></div>
            </div>
        </div>
    </div>
</section>
