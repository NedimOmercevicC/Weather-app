<section class="masthead bg-primary text-white text-center" style="padding-top: 100px; padding-bottom: 50px;">
    <div class="container px-4 px-lg-5">
        <h1 class="mb-4">My Dashboard</h1>
        <p class="text-white-50">Welcome to your personalized weather dashboard</p>
    </div>
</section>

<section class="page-section" id="dashboard-content">
    <div class="container px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5">
            <div class="col-md-12">
                <div id="dashboardError" class="alert alert-danger d-none" role="alert"></div>
                <div id="dashboardLoading" class="text-center">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <div id="dashboardContent" class="d-none">
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header bg-primary text-white">
                                    <h5 class="mb-0">My Profile</h5>
                                </div>
                                <div class="card-body" id="userProfile">
                                    <!-- User profile info will be loaded here -->
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header bg-success text-white">
                                    <h5 class="mb-0">Active Subscription</h5>
                                </div>
                                <div class="card-body" id="activeSubscription">
                                    <!-- Active subscription will be loaded here -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-12">
                            <div class="card">
                                <div class="card-header bg-info text-white">
                                    <h5 class="mb-0">My Saved Filters</h5>
                                </div>
                                <div class="card-body">
                                    <div id="savedFiltersList">
                                        <!-- Saved filters will be loaded here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <div class="card">
                                <div class="card-header bg-warning text-dark">
                                    <h5 class="mb-0">Payment History</h5>
                                </div>
                                <div class="card-body">
                                    <div id="paymentHistory">
                                        <!-- Payment history will be loaded here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    // Dashboard initialization will be handled by router.js
    document.addEventListener('DOMContentLoaded', () => {
        const router = window.routerInstance;
        if (router) {
            router.loadDashboard();
        }
    });
</script>
