<!-- Auth Modal -->
<div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="authModalLabel">Login or Signup</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-tabs" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab" aria-controls="login" aria-selected="true">Login</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="signup-tab" data-bs-toggle="tab" data-bs-target="#signupTab" type="button" role="tab" aria-controls="signupTab" aria-selected="false">Signup</button>
                    </li>
                </ul>
                <div class="tab-content pt-3" id="authTabsContent">
                    <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
                        <form id="loginForm" class="vstack gap-3">
                            <input class="form-control" id="loginEmail" type="email" placeholder="Email" required>
                            <input class="form-control" id="loginPassword" type="password" placeholder="Password" required>
                            <button class="btn btn-primary" type="submit">Login</button>
                            <div class="text-danger small d-none" id="loginError"></div>
                        </form>
                    </div>
                    <div class="tab-pane fade" id="signupTab" role="tabpanel" aria-labelledby="signup-tab">
                        <form id="signupForm" class="vstack gap-3">
                            <input class="form-control" id="signupEmail" type="email" placeholder="Email" required>
                            <input class="form-control" id="signupPassword" type="password" placeholder="Password (min 6 chars)" minlength="6" required>
                            <button class="btn btn-success" type="submit">Create Account</button>
                            <div class="text-danger small d-none" id="signupError"></div>
                            <div class="text-success small d-none" id="signupSuccess">Account created. You can log in now.</div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Payment Modal -->
<div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="paymentModalLabel">Complete Subscription (BAM)</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="paymentForm" class="vstack gap-3">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="payerFullName" class="form-label">Full Name</label>
                            <input class="form-control" id="payerFullName" type="text" placeholder="Your full name" required>
                        </div>
                        <div class="col-12">
                            <label for="cardName" class="form-label">Name on Card</label>
                            <input class="form-control" id="cardName" type="text" placeholder="Name on card" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Plan</label>
                            <input class="form-control" id="paymentPlan" type="text" value="" readonly>
                        </div>
                    </div>
                    <button class="btn btn-primary" type="submit">Pay Now (BAM)</button>
                    <div class="text-danger small d-none" id="paymentError"></div>
                    <div class="text-success small d-none" id="paymentSuccess">Payment successful. Welcome!</div>
                </form>
            </div>
        </div>
    </div>
</div>
